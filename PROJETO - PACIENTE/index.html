<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Paciente</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body class="bg-primary bg-gradient">
    <div class="container py-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <!-- TÍTULO -->
                <div class="bg-primary text-white text-center rounded-4 p-4 mb-5">
                    <img src="img/Logo-Clinica-Saude-Logotipo-para-clinica-medica-7.png" alt="Logo da Clínica" class="mb-3" style="width: 100px;">
                    <h2 class="fw-bold mb-1">CADASTRO DO PACIENTE</h2>
                    <small>Formulário de cadastro de paciente</small>
                </div>

                <form action="" method="post">

                    <!-- NOME -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            NOME COMPLETO *
                        </label>

                        <input 
                            type="text"
                            name="nome"
                            class="form-control form-control-lg"
                            placeholder="Digite seu nome completo"
                            required
                        >
                    </div>

                    <!-- CPF + NASCIMENTO -->
                    <div class="row g-4 mb-4">

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                CPF *
                            </label>

                            <input 
                                type="text"
                                name="cpf"
                                class="form-control form-control-lg"
                                placeholder="000.000.000-00"
                                maxlength="14"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                DATA DE NASCIMENTO *
                            </label>

                            <input 
                                type="date"
                                name="nascimento"
                                class="form-control form-control-lg"
                                required
                            >
                        </div>

                    </div>

                    <!-- SEXO + ESTADO CIVIL -->
                    <div class="row g-4 mb-4">

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                SEXO *
                            </label>

                            <select 
                                name="sexo"
                                class="form-select form-select-lg"
                                required
                            >
                                <option value="">Selecione</option>
                                <option value="masculino">Masculino</option>
                                <option value="feminino">Feminino</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                ESTADO CIVIL *
                            </label>

                            <select 
                                name="estado_civil"
                                class="form-select form-select-lg"
                                required
                            >
                                <option value="">Selecione</option>
                                <option value="solteiro">Solteiro(a)</option>
                                <option value="casado">Casado(a)</option>
                                <option value="divorciado">Divorciado(a)</option>
                                <option value="viuvo">Viúvo(a)</option>
                            </select>
                        </div>

                    </div>

                    <hr class="my-5">

                    <!-- TELEFONES -->
                    <div class="row g-4 mb-4">

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                TELEFONE CELULAR *
                            </label>

                            <input 
                                type="text"
                                name="telefone_celular"
                                class="form-control form-control-lg"
                                placeholder="(00) 00000-0000"
                                maxlength="15"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                TELEFONE FIXO
                            </label>

                            <input 
                                type="text"
                                name="telefone_fixo"
                                class="form-control form-control-lg"
                                placeholder="(00) 0000-0000"
                                maxlength="14"
                            >
                        </div>

                    </div>

                    <!-- EMAIL + CEP -->
                    <div class="row g-4 mb-4">

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                EMAIL *
                            </label>

                            <input 
                                type="email"
                                name="email"
                                class="form-control form-control-lg"
                                placeholder="Digite seu email"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                CEP *
                            </label>

                            <input 
                                type="text"
                                name="cep"
                                class="form-control form-control-lg"
                                placeholder="00000-000"
                                maxlength="9"
                                required
                            >
                        </div>

                    </div>

                    <!-- ENDEREÇO -->
                    <div class="row g-4 mb-4">

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                ENDEREÇO
                            </label>

                            <input 
                                type="text"
                                name="endereco"
                                class="form-control form-control-lg"
                                placeholder="Endereço completo"
                                readonly
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                BAIRRO
                            </label>

                            <input 
                                type="text"
                                name="bairro"
                                class="form-control form-control-lg"
                                placeholder="Bairro"
                                readonly
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                CIDADE
                            </label>

                            <input 
                                type="text"
                                name="cidade"
                                class="form-control form-control-lg"
                                placeholder="Cidade"
                                readonly
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                ESTADO
                            </label>

                            <input 
                                type="text"
                                name="estado"
                                class="form-control form-control-lg"
                                placeholder="Estado"
                                readonly
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                COMPLEMENTO
                            </label>

                            <input 
                                type="text"
                                name="complemento"
                                class="form-control form-control-lg"
                                placeholder="Complemento"
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">
                                NÚMERO
                            </label>

                            <input 
                                type="text"
                                name="numero"
                                class="form-control form-control-lg"
                                placeholder="Número"
                            >
                        </div>

                        <hr class="my-5">

                        <!-- Informações Medicas-->

                        <!-- CARTÃO SUS (Opcional)  + Convenio Medico (Lista Suspensa)-->

                            <div class="col-md-6">
                                <label class="form-label">
                                    Numero Do Cartão SUS
                                </label>
                                <input 
                                    type="text"
                                    name="cartao_sus"
                                    class="form-control form-control-lg"
                                    placeholder="Digite o número do cartão SUS"
                                >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">
                                    Convênio Médico
                                </label>
                                <select class="form-control form-control-lg" name="convenio_medico">
                                    <option value="">Selecione um convênio</option>
                                    <option value="amil">Amil</option>
                                    <option value="unimed">Unimed</option>
                                    <option value="greenmed">Greenmed</option>
                                </select>
                            </div>

                            <!--Número da carteirinha do convênio  + Medico Responsável-->

                            <div class="col-md-6">
                                <label class="form-label">
                                    Número da Carteirinha do Convênio
                                </label>
                                <input 
                                    type="text"
                                    name="carteirinha_convenio"
                                    class="form-control form-control-lg"
                                    placeholder="Digite o número da carteirinha"
                                >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">
                                    Médico Responsável
                                </label>
                                <input 
                                    type="text"
                                    name="medico_responsavel"
                                    class="form-control form-control-lg"
                                    placeholder="Digite o nome do médico responsável"
                                >
                            </div>
                            
                            <!--Observaçoes medicas-->
                            <div class="col-md-12">
                                <label class="form-label">
                                    Observações Médicas
                                </label>
                                <textarea name="observacoes_medicas" class="form-control form-control-lg" rows="4" placeholder="Digite aqui quaisquer observações médicas relevantes"></textarea>
                            </div>

                            <hr class="my-5">

                            <!-- Area de upload de documentos + Botao Salvar-->

                            <div class="col-md-12">
                                <label class="form-label">
                                    Upload de Documentos
                                </label>
                                <input type="file" name="documentos" class="form-control form-control-lg" multiple>
                            </div>
                            <div class="col-md-12">
                                <button type="submit" id="salvar" class="btn btn-primary btn-lg">
                                    Salvar
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
